name: Test and build fetchplane

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (e.g., v1.2.3)"
        required: true
        default: ""

permissions:
  contents: write   # required to create releases & upload assets

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build the application
        run: make

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: fetchplane-linux
          path: ./dist/linux/*
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: fetchplane-windows
          path: ./dist/windows/*
      - name: Upload MacOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: fetchplane-macos
          path: ./dist/macos/*
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: fetchplane-docker-image
          path: ./dist/docker/*
      
      - name: Collect all build artifacts for release
        uses: actions/download-artifact@v4
        if: github.event.inputs.tag != ''
        with:
          pattern: fetchplane-*
          merge-multiple: true
          path: release_assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.tag != ''
        with:
          draft: true
          tag_name: github.event.inputs.tag
          generate_release_notes: true
          files: |
            release_assets/*
