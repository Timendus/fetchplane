<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fetchplane</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="page-header">
        <div>
          <h1>Fetchplane</h1>
        </div>
        <button
          id="settings-open"
          class="icon-button"
          type="button"
          aria-label="Open settings"
          aria-haspopup="dialog"
          aria-controls="settings-dialog"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10.4 2.4h3.2l.7 2.1a7 7 0 0 1 1.6.7l2-1 2.3 2.3-1 2a7 7 0 0 1 .7 1.6l2.1.7v3.2l-2.1.7a7 7 0 0 1-.7 1.6l1 2-2.3 2.3-2-1a7 7 0 0 1-1.6.7l-.7 2.1h-3.2l-.7-2.1a7 7 0 0 1-1.6-.7l-2 1-2.3-2.3 1-2a7 7 0 0 1-.7-1.6l-2.1-.7v-3.2l2.1-.7a7 7 0 0 1 .7-1.6l-1-2L6.2 4.2l2 1a7 7 0 0 1 1.6-.7z"
            ></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>
        </button>
      </header>

      <section class="grid" aria-label="Service overview">
        <section class="card" aria-labelledby="auth-heading">
          <header class="card-header">
            <h2 id="auth-heading">Authentication</h2>
          </header>
          <section id="auth-card" aria-live="polite"></section>
          <footer class="actions">
            <form
              id="login-form"
              method="post"
              action="/auth/login"
              target="_blank"
            >
              <button type="submit">Log in</button>
            </form>
          </footer>
        </section>

        <section class="card" aria-labelledby="runner-heading">
          <header class="card-header">
            <h2 id="runner-heading">Job runner</h2>
          </header>
          <section id="runner-card" aria-live="polite"></section>
          <footer class="actions">
            <form id="sync-form" method="post" action="/sync/now">
              <button type="submit">Start new sync job</button>
            </form>
          </footer>
        </section>
      </section>

      <section class="card" aria-labelledby="jobs-heading">
        <header class="card-header">
          <h2 id="jobs-heading">Recent Jobs</h2>
        </header>
        <ol id="jobs-list" class="jobs-list" aria-live="polite"></ol>
      </section>
    </main>

    <dialog
      id="settings-dialog"
      class="settings-dialog"
      aria-labelledby="settings-heading"
    >
      <form id="settings-form" class="settings-form" method="dialog">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">Config</p>
            <h2 id="settings-heading">Settings</h2>
          </div>
          <button
            id="settings-close"
            class="icon-button icon-button-subtle"
            type="button"
            aria-label="Close settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12"></path>
              <path d="M18 6L6 18"></path>
            </svg>
          </button>
        </header>

        <fieldset class="settings-grid">
          <legend class="sr-only">Config file settings</legend>

          <label class="field">
            <span>Poll interval (seconds)</span>
            <input
              id="poll-interval"
              name="pollInterval"
              type="number"
              min="1"
              required
            />
          </label>

          <label class="field">
            <span>Max days to download</span>
            <input
              id="max-days-to-download"
              name="maxDaysToDownload"
              type="number"
              min="1"
              required
            />
          </label>

          <label class="field">
            <span>Remove older than days</span>
            <input
              id="remove-older-than-days"
              name="removeOlderThanDays"
              type="number"
              min="0"
              required
            />
          </label>
        </fieldset>

        <footer class="settings-footer">
          <p id="settings-status" class="muted" aria-live="polite"></p>
          <div class="actions">
            <button type="submit">Save settings</button>
          </div>
        </footer>
      </form>
    </dialog>
    <script src="/static/app.js" defer></script>
  </body>
</html>
