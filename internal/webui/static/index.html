<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fetchplane</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="page-header">
        <h1>Fetchplane</h1>
      </header>

      <section class="grid" aria-label="Service overview">
        <section class="card" aria-labelledby="auth-heading">
          <header class="card-header">
            <h2 id="auth-heading">Authentication</h2>
          </header>
          <section id="auth-card" aria-live="polite"></section>
          <footer class="actions">
            <form
              id="login-form"
              method="post"
              action="/auth/login"
              target="_blank"
            >
              <button type="submit">Log in</button>
            </form>
          </footer>
        </section>

        <section class="card" aria-labelledby="runner-heading">
          <header class="card-header">
            <h2 id="runner-heading">Job runner</h2>
          </header>
          <section id="runner-card" aria-live="polite"></section>
          <footer class="actions">
            <form id="sync-form" method="post" action="/sync/now">
              <button type="submit">Start new sync job</button>
            </form>
          </footer>
        </section>
      </section>

      <section class="card" aria-labelledby="jobs-heading">
        <header class="card-header">
          <h2 id="jobs-heading">Recent Jobs</h2>
        </header>
        <ol id="jobs-list" class="jobs-list" aria-live="polite"></ol>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
